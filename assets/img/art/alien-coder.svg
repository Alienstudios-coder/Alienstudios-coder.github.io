<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A friendly green alien coding on a laptop on a small moon</title>
  <style>
    .blink { animation: blink 2.4s ease-in-out infinite; }
    .blink2 { animation: blink 2.4s ease-in-out 1.2s infinite; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; }
    .float { animation: fl 5s ease-in-out infinite; }
    .float2 { animation: fl 6s ease-in-out 1.5s infinite; }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
    @keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="ac-bg" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#2a3f80"/><stop offset=".55" stop-color="#12204a"/><stop offset="1" stop-color="#0b1530"/></radialGradient>
    <linearGradient id="ac-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c58b"/></linearGradient>
    <linearGradient id="ac-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f9f70"/></linearGradient>
    <linearGradient id="ac-planet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
    <linearGradient id="ac-moon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a52a0"/><stop offset="1" stop-color="#1b2d63"/></linearGradient>
    <linearGradient id="ac-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5fc"/><stop offset="1" stop-color="#c6cfe1"/></linearGradient>
    <radialGradient id="ac-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4fd1ff" stop-opacity=".55"/><stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/></radialGradient>
    <clipPath id="ac-clip"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#ac-bg)"/>
  <g clip-path="url(#ac-clip)">
    <!-- stars -->
    <g fill="#e9eefb">
      <circle class="twinkle" cx="70" cy="90" r="2.2"/><circle class="twinkle t2" cx="110" cy="45" r="1.6"/>
      <circle class="twinkle t3" cx="300" cy="150" r="1.8"/><circle class="twinkle" cx="60" cy="200" r="1.4"/>
      <circle class="twinkle t2" cx="345" cy="230" r="2"/><circle class="twinkle t3" cx="150" cy="70" r="1.2"/>
      <circle cx="250" cy="40" r="1.3"/><circle cx="40" cy="150" r="1"/><circle cx="360" cy="190" r="1.1"/>
    </g>
    <path d="M95 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffd98a" class="twinkle t2"/>
    <!-- ringed planet -->
    <g transform="translate(300 92)">
      <ellipse rx="64" ry="14" fill="none" stroke="#ffc94d" stroke-opacity=".5" stroke-width="5" transform="rotate(-18)"/>
      <circle r="36" fill="url(#ac-planet)"/>
      <path d="M-30 -10 Q0 -18 33 -4" stroke="#e09a12" stroke-width="5" fill="none" opacity=".5"/>
      <path d="M-34 10 Q0 4 35 14" stroke="#fff3d1" stroke-width="3" fill="none" opacity=".5"/>
      <path d="M-64 0 A64 14 0 0 0 64 0" transform="rotate(-18)" fill="none" stroke="#ffc94d" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- floating code glyphs -->
    <g font-family="ui-monospace, Consolas, monospace" font-weight="700">
      <text class="float" x="62" y="150" font-size="28" fill="#ffc94d">&lt;/&gt;</text>
      <text class="float2" x="300" y="200" font-size="24" fill="#4fd1ff">{ }</text>
    </g>

    <!-- moon surface -->
    <ellipse cx="200" cy="430" rx="250" ry="105" fill="url(#ac-moon)"/>
    <ellipse cx="90" cy="352" rx="22" ry="6" fill="#12204a" opacity=".7"/>
    <ellipse cx="320" cy="360" rx="28" ry="7" fill="#12204a" opacity=".7"/>
    <ellipse cx="250" cy="385" rx="14" ry="4" fill="#12204a" opacity=".7"/>

    <!-- antennae -->
    <path d="M178 104 Q168 80 156 58" stroke="#22c58b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M222 104 Q232 80 244 58" stroke="#22c58b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle class="blink" cx="155" cy="55" r="9" fill="#ffc94d"/>
    <circle class="blink2" cx="245" cy="55" r="9" fill="#ffc94d"/>

    <!-- body -->
    <path d="M150 300 Q152 238 200 236 Q248 238 250 300 Z" fill="url(#ac-body)"/>
    <!-- head -->
    <path d="M200 96 C258 96 284 136 278 172 C272 212 236 244 200 244 C164 244 128 212 122 172 C116 136 142 96 200 96 Z" fill="url(#ac-skin)"/>
    <ellipse cx="172" cy="118" rx="22" ry="9" fill="#fff" opacity=".28" transform="rotate(-20 172 118)"/>
    <!-- eyes -->
    <ellipse cx="168" cy="176" rx="23" ry="17" fill="#0b1530" transform="rotate(14 168 176)"/>
    <ellipse cx="232" cy="176" rx="23" ry="17" fill="#0b1530" transform="rotate(-14 232 176)"/>
    <circle cx="161" cy="168" r="6.5" fill="#fff"/><circle cx="225" cy="168" r="6.5" fill="#fff"/>
    <circle cx="173" cy="182" r="2.2" fill="#4fd1ff"/><circle cx="237" cy="182" r="2.2" fill="#4fd1ff"/>
    <!-- cheeks + smile -->
    <ellipse cx="146" cy="203" rx="9" ry="5" fill="#fb7185" opacity=".45"/>
    <ellipse cx="254" cy="203" rx="9" ry="5" fill="#fb7185" opacity=".45"/>
    <path d="M186 212 Q200 224 214 212" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- screen glow -->
    <ellipse cx="200" cy="250" rx="110" ry="60" fill="url(#ac-glow)"/>
    <!-- laptop (back of lid facing us) -->
    <rect x="118" y="256" width="164" height="104" rx="12" fill="url(#ac-lid)"/>
    <rect x="118" y="256" width="164" height="104" rx="12" fill="none" stroke="#a7b3cf" stroke-width="2"/>
    <!-- studio mark on lid -->
    <g transform="translate(200 306)">
      <circle r="20" fill="#0b1530"/>
      <path d="M0 -12 C9 -12 13 -5 12 1 C11 8 5 13 0 13 C-5 13 -11 8 -12 1 C-13 -5 -9 -12 0 -12Z" fill="#f5b731"/>
      <ellipse cx="-5" cy="1" rx="3.6" ry="2.2" fill="#0b1530" transform="rotate(24 -5 1)"/>
      <ellipse cx="5" cy="1" rx="3.6" ry="2.2" fill="#0b1530" transform="rotate(-24 5 1)"/>
    </g>
    <rect x="96" y="358" width="208" height="12" rx="6" fill="#a7b3cf"/>
    <rect x="96" y="358" width="208" height="4" rx="2" fill="#dde3ef"/>
    <!-- hands on the lid -->
    <ellipse cx="132" cy="258" rx="15" ry="10" fill="#34d399"/>
    <ellipse cx="268" cy="258" rx="15" ry="10" fill="#34d399"/>
    <path d="M124 252 v8 M132 250 v9 M140 252 v8" stroke="#0f9f70" stroke-width="2" stroke-linecap="round"/>
    <path d="M260 252 v8 M268 250 v9 M276 252 v8" stroke="#0f9f70" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f5b731" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="200" cy="200" r="197" fill="none" stroke="#f5b731" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 10"/>
</svg>
