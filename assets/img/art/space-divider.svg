<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Planets, a flying saucer and stars along an orbit line</title>
  <style>
    .ufo { animation: ufo 6s ease-in-out infinite; }
    .beam { animation: beam 3s ease-in-out infinite; }
    .twinkle { animation: tw 3s ease-in-out infinite; } .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; }
    .lights { animation: tw 1s steps(2) infinite; }
    @keyframes ufo { 0%,100% { transform: translate(0,0) } 50% { transform: translate(14px,-8px) } }
    @keyframes beam { 0%,100% { opacity: .55 } 50% { opacity: .2 } }
    @keyframes tw { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sd-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
    <linearGradient id="sd-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa7ff"/><stop offset="1" stop-color="#2a3f80"/></linearGradient>
    <linearGradient id="sd-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="sd-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#0f9f70"/></linearGradient>
    <linearGradient id="sd-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc94d" stop-opacity=".9"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- orbit line -->
  <path d="M0 120 C200 60 400 150 600 100 S1000 50 1200 110" fill="none" stroke="#f5b731" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="8 12"/>

  <!-- stars -->
  <g fill="#f5b731">
    <path class="twinkle" d="M120 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="twinkle t2" d="M470 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path class="twinkle t3" d="M760 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="twinkle" d="M1120 40 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>
  <g fill="#7aa7ff">
    <circle class="twinkle t2" cx="300" cy="40" r="3"/><circle class="twinkle" cx="560" cy="160" r="2.5"/>
    <circle class="twinkle t3" cx="880" cy="30" r="3"/><circle cx="1010" cy="160" r="2.5"/><circle cx="60" cy="150" r="2.5"/>
    <circle cx="680" cy="40" r="2"/><circle cx="380" cy="150" r="2"/>
  </g>

  <!-- small green planet -->
  <circle cx="70" cy="95" r="22" fill="url(#sd-green)"/>
  <circle cx="62" cy="88" r="5" fill="#fff" opacity=".35"/>

  <!-- ringed gold planet -->
  <g transform="translate(230 92)">
    <ellipse rx="70" ry="15" fill="none" stroke="#f5b731" stroke-opacity=".55" stroke-width="5" transform="rotate(-14)"/>
    <circle r="40" fill="url(#sd-gold)"/>
    <path d="M-34 -10 Q0 -20 37 -4" stroke="#e09a12" stroke-width="5" fill="none" opacity=".5"/>
    <path d="M-38 12 Q0 4 39 16" stroke="#fff3d1" stroke-width="3" fill="none" opacity=".5"/>
    <path d="M-70 0 A70 15 0 0 0 70 0" transform="rotate(-14)" fill="none" stroke="#f5b731" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- UFO with beam -->
  <g class="ufo">
    <path class="beam" d="M580 74 L540 170 H660 L620 74 Z" fill="url(#sd-beam)"/>
    <ellipse cx="600" cy="54" rx="26" ry="24" fill="#4fd1ff" opacity=".85"/>
    <path d="M582 52 C582 36 618 36 618 52 Z" fill="#34d399"/>
    <ellipse cx="594" cy="48" rx="3.5" ry="2.6" fill="#0b1530"/><ellipse cx="606" cy="48" rx="3.5" ry="2.6" fill="#0b1530"/>
    <ellipse cx="600" cy="68" rx="64" ry="16" fill="#a7b3cf"/>
    <ellipse cx="600" cy="63" rx="64" ry="12" fill="#e9eefb"/>
    <g class="lights" fill="#ffc94d"><circle cx="560" cy="68" r="4"/><circle cx="600" cy="72" r="4"/><circle cx="640" cy="68" r="4"/></g>
    <!-- a little box (data!) being beamed up -->
    <rect x="590" y="128" width="20" height="20" rx="3" fill="#f5b731" transform="rotate(12 600 138)"/>
  </g>

  <!-- blue planet with craters -->
  <circle cx="900" cy="96" r="34" fill="url(#sd-blue)"/>
  <circle cx="890" cy="86" r="7" fill="#12204a" opacity=".45"/><circle cx="912" cy="106" r="5" fill="#12204a" opacity=".45"/><circle cx="896" cy="112" r="3.5" fill="#12204a" opacity=".45"/>
  <!-- moon of blue planet -->
  <circle cx="958" cy="60" r="9" fill="#c6cfe1"/>

  <!-- rose planet -->
  <circle cx="1110" cy="110" r="24" fill="url(#sd-rose)"/>
  <path d="M1090 104 Q1110 98 1132 106" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none"/>
</svg>
