<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A rocket piloted by an alien lifting off over a city skyline at night</title>
  <style>
    .flame { transform-origin: 0 0; animation: fl .18s ease-in-out infinite alternate; }
    .ship { animation: up 4s ease-in-out infinite; }
    .twinkle { animation: tw 3s ease-in-out infinite; } .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; }
    .win { animation: win 5s steps(1) infinite; }
    @keyframes fl { from { transform: scaleY(1) } to { transform: scaleY(1.25) } }
    @keyframes up { 0%,100% { transform: translate(0,0) } 50% { transform: translate(6px,-10px) } }
    @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
    @keyframes win { 0%,60% { opacity: 1 } 61%,100% { opacity: .3 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="rl-bg" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#2a3f80"/><stop offset=".6" stop-color="#12204a"/><stop offset="1" stop-color="#0b1530"/></radialGradient>
    <linearGradient id="rl-hull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9eefb"/><stop offset="1" stop-color="#a7b3cf"/></linearGradient>
    <linearGradient id="rl-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d1"/><stop offset=".35" stop-color="#ffc94d"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient>
    <linearGradient id="rl-moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d1"/><stop offset="1" stop-color="#ffc94d"/></linearGradient>
    <mask id="rl-crescent"><rect width="400" height="400" fill="#fff"/><circle cx="110" cy="86" r="27" fill="#000"/></mask>
    <clipPath id="rl-clip"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#rl-bg)"/>
  <g clip-path="url(#rl-clip)">
    <g fill="#e9eefb">
      <circle class="twinkle" cx="60" cy="120" r="2"/><circle class="twinkle t2" cx="120" cy="60" r="1.5"/>
      <circle class="twinkle t3" cx="330" cy="210" r="1.8"/><circle cx="90" cy="200" r="1.2"/>
      <circle class="twinkle t2" cx="300" cy="60" r="1.4"/><circle cx="170" cy="40" r="1.1"/><circle cx="40" cy="250" r="1.3"/>
    </g>
    <!-- crescent moon -->
    <circle cx="96" cy="96" r="30" fill="url(#rl-moon)" mask="url(#rl-crescent)"/>
    <!-- orbit dashes -->
    <path d="M30 300 Q200 120 380 70" fill="none" stroke="#f5b731" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 9"/>

    <!-- skyline -->
    <g fill="#0b1530">
      <rect x="10" y="300" width="40" height="100"/><rect x="48" y="270" width="30" height="130"/>
      <rect x="80" y="315" width="44" height="85"/><rect x="122" y="250" width="34" height="150"/>
      <path d="M139 250 v-24" stroke="#0b1530" stroke-width="3"/>
      <rect x="156" y="290" width="40" height="110"/><rect x="230" y="275" width="36" height="125"/>
      <path d="M266 400 V240 h28 l12 20 V400z"/><rect x="306" y="300" width="40" height="100"/><rect x="344" y="280" width="46" height="120"/>
    </g>
    <g fill="#ffc94d" opacity=".85">
      <rect x="56" y="282" width="5" height="7"/><rect x="66" y="300" width="5" height="7" class="win"/><rect x="56" y="318" width="5" height="7"/>
      <rect x="130" y="265" width="5" height="7"/><rect x="142" y="285" width="5" height="7" class="win"/><rect x="130" y="305" width="5" height="7"/>
      <rect x="240" y="290" width="5" height="7" class="win"/><rect x="252" y="310" width="5" height="7"/>
      <rect x="276" y="260" width="5" height="7"/><rect x="286" y="280" width="5" height="7"/><rect x="276" y="300" width="5" height="7" class="win"/>
      <rect x="354" y="295" width="5" height="7"/><rect x="368" y="315" width="5" height="7" class="win"/>
      <rect x="18" y="315" width="5" height="7"/><rect x="92" y="330" width="5" height="7"/><rect x="166" y="305" width="5" height="7"/>
    </g>
    <!-- launch smoke -->
    <g fill="#c6cfe1" opacity=".9">
      <circle cx="170" cy="385" r="26"/><circle cx="205" cy="372" r="30"/><circle cx="240" cy="388" r="24"/>
      <circle cx="140" cy="398" r="20"/><circle cx="268" cy="400" r="20"/>
    </g>

    <!-- rocket, tilted -->
    <g class="ship">
      <g transform="translate(212 196) rotate(28)">
        <g transform="translate(0 70)"><path class="flame" d="M-20 0 Q0 115 20 0 Z" fill="url(#rl-flame)"/></g>
        <!-- fins -->
        <path d="M-26 30 L-50 70 L-24 62 Z" fill="#fb7185"/>
        <path d="M26 30 L50 70 L24 62 Z" fill="#e11d48"/>
        <path d="M-4 40 L0 76 L4 40 Z" fill="#e11d48"/>
        <!-- hull -->
        <path d="M0 -92 C34 -60 34 20 24 66 H-24 C-34 20 -34 -60 0 -92 Z" fill="url(#rl-hull)"/>
        <path d="M0 -92 C14 -80 22 -66 26 -50 H-26 C-22 -66 -14 -80 0 -92 Z" fill="#f5b731"/>
        <rect x="-24" y="56" width="48" height="12" rx="4" fill="#2a3f80"/>
        <!-- porthole with alien -->
        <circle cy="-12" r="19" fill="#1b2d63" stroke="#ffc94d" stroke-width="5"/>
        <path d="M0 -24 C9 -24 13 -17 12 -11 C11 -4 5 1 0 1 C-5 1 -11 -4 -12 -11 C-13 -17 -9 -24 0 -24Z" fill="#34d399"/>
        <ellipse cx="-5" cy="-11" rx="3.6" ry="2.6" fill="#0b1530"/>
        <ellipse cx="5" cy="-11" rx="3.6" ry="2.6" fill="#0b1530"/>
        <path d="M-6 -27 a7 7 0 0 1 12 0" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none"/>
        <circle cy="28" r="5" fill="#4fd1ff"/>
      </g>
    </g>
  </g>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f5b731" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="200" cy="200" r="197" fill="none" stroke="#f5b731" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 10"/>
</svg>
