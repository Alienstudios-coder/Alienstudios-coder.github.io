<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A confused alien astronaut drifting in space holding an upside-down map</title>
  <style>
    .drift { animation: drift 7s ease-in-out infinite; transform-origin: 200px 160px; }
    .q { animation: q 2s ease-in-out infinite; }
    .twinkle { animation: tw 3s ease-in-out infinite; } .t2 { animation-delay: 1s; }
    @keyframes drift { 0%,100% { transform: translate(0,0) rotate(-8deg) } 50% { transform: translate(0,-14px) rotate(6deg) } }
    @keyframes q { 0%,100% { transform: translateY(0); opacity: 1 } 50% { transform: translateY(-6px); opacity: .6 } }
    @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="la-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c58b"/></linearGradient>
    <linearGradient id="la-suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c6cfe1"/></linearGradient>
    <radialGradient id="la-glass" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#4fd1ff" stop-opacity=".35"/><stop offset="1" stop-color="#1b2d63" stop-opacity=".25"/></radialGradient>
  </defs>
  <!-- broken tether -->
  <path d="M0 250 C60 240 80 290 130 255 C150 242 150 230 160 222" fill="none" stroke="#a7b3cf" stroke-width="4" stroke-dasharray="2 0"/>
  <path d="M160 222 l6 -4 M158 216 l7 0" stroke="#ffc94d" stroke-width="3" stroke-linecap="round"/>
  <g fill="#ffd98a">
    <path class="twinkle" d="M60 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="twinkle t2" d="M340 230 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
  </g>
  <g class="drift">
    <!-- backpack -->
    <rect x="160" y="148" width="80" height="90" rx="16" fill="#a7b3cf"/>
    <!-- legs -->
    <rect x="172" y="226" width="24" height="54" rx="12" fill="url(#la-suit)" transform="rotate(14 184 226)"/>
    <rect x="206" y="226" width="24" height="54" rx="12" fill="url(#la-suit)" transform="rotate(-20 218 226)"/>
    <ellipse cx="176" cy="282" rx="16" ry="9" fill="#2a3f80" transform="rotate(14 176 282)"/>
    <ellipse cx="236" cy="278" rx="16" ry="9" fill="#2a3f80" transform="rotate(-20 236 278)"/>
    <!-- body -->
    <rect x="166" y="160" width="68" height="80" rx="26" fill="url(#la-suit)"/>
    <rect x="186" y="186" width="28" height="18" rx="4" fill="#1b2d63"/>
    <circle cx="194" cy="195" r="3" fill="#fb7185"/><circle cx="206" cy="195" r="3" fill="#34d399"/>
    <!-- left arm scratching helmet -->
    <path d="M170 176 Q136 160 140 122" stroke="url(#la-suit)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="141" cy="118" r="12" fill="#f5b731"/>
    <!-- right arm holding map -->
    <path d="M230 178 Q262 186 270 210" stroke="url(#la-suit)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- map (upside down) -->
    <g transform="translate(286 214) rotate(168)">
      <path d="M-36 -26 L-12 -32 L12 -26 L36 -32 V26 L12 32 L-12 26 L-36 32 Z" fill="#fff3d1" stroke="#e09a12" stroke-width="2"/>
      <path d="M-12 -32 V26 M12 -26 V32" stroke="#e09a12" stroke-width="1.5" opacity=".7"/>
      <path d="M-26 10 Q-10 -8 4 4 T26 -14" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="4 4"/>
      <path d="M22 -18 l6 6 M28 -18 l-6 6" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <circle cx="270" cy="212" r="12" fill="#f5b731"/>
    <!-- head in helmet -->
    <circle cx="200" cy="112" r="58" fill="#e9eefb"/>
    <circle cx="200" cy="112" r="50" fill="#0b1530"/>
    <path d="M200 74 C230 74 244 96 241 116 C238 138 220 154 200 154 C180 154 162 138 159 116 C156 96 170 74 200 74Z" fill="url(#la-skin)"/>
    <ellipse cx="184" cy="116" rx="12" ry="10" fill="#0b1530"/>
    <ellipse cx="216" cy="116" rx="12" ry="10" fill="#0b1530"/>
    <circle cx="180" cy="112" r="4" fill="#fff"/><circle cx="212" cy="112" r="4" fill="#fff"/>
    <path d="M192 140 q4 -5 8 0 q4 5 8 0" stroke="#065f46" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="112" r="50" fill="url(#la-glass)"/>
    <path d="M168 84 A42 42 0 0 1 206 68" stroke="#fff" stroke-opacity=".7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="54" r="7" fill="#ffc94d"/>
  </g>
  <!-- question marks -->
  <g font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-weight="700" fill="#ffc94d">
    <text class="q" x="262" y="72" font-size="44">?</text>
    <text class="q t2" x="294" y="44" font-size="28" style="animation-delay:.6s">?</text>
  </g>
</svg>
