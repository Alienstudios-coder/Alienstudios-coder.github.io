<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A satellite sending a message signal down to a planet</title>
  <style>
    .wave { animation: wv 2.4s ease-out infinite; opacity: 0; }
    .w2 { animation-delay: .8s; } .w3 { animation-delay: 1.6s; }
    .sat { animation: bob 6s ease-in-out infinite; }
    .env { animation: bob 4s ease-in-out .8s infinite; }
    .twinkle { animation: tw 3s ease-in-out infinite; } .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; }
    @keyframes wv { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .wave { opacity: 1; } }
  </style>
  <defs>
    <radialGradient id="ss-bg" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#2a3f80"/><stop offset=".6" stop-color="#12204a"/><stop offset="1" stop-color="#0b1530"/></radialGradient>
    <linearGradient id="ss-planet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#1b2d63"/></linearGradient>
    <linearGradient id="ss-panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#2a3f80"/></linearGradient>
    <clipPath id="ss-clip"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#ss-bg)"/>
  <g clip-path="url(#ss-clip)">
    <g fill="#e9eefb">
      <circle class="twinkle" cx="60" cy="110" r="2"/><circle class="twinkle t2" cx="330" cy="80" r="1.6"/>
      <circle class="twinkle t3" cx="350" cy="200" r="1.8"/><circle cx="80" cy="230" r="1.2"/>
      <circle class="twinkle t2" cx="150" cy="50" r="1.4"/><circle cx="260" cy="40" r="1.1"/><circle cx="40" cy="180" r="1.3"/>
    </g>
    <path d="M320 140 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffd98a" class="twinkle t3"/>

    <!-- planet -->
    <circle cx="200" cy="560" r="250" fill="url(#ss-planet)"/>
    <path d="M40 360 Q90 330 140 350 T240 345 T360 360" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" opacity=".55"/>
    <path d="M100 390 Q160 372 210 385" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" opacity=".45"/>
    <path d="M-50 330 A250 250 0 0 1 450 330" fill="none" stroke="#4fd1ff" stroke-opacity=".5" stroke-width="6"/>
    <!-- location pin on planet -->
    <g transform="translate(200 336)">
      <path d="M0 0 C-12 -14 -14 -20 -14 -26 A14 14 0 0 1 14 -26 C14 -20 12 -14 0 0Z" fill="#f5b731"/>
      <circle cy="-26" r="5.5" fill="#0b1530"/>
    </g>

    <!-- signal waves -->
    <g fill="none" stroke="#ffc94d" stroke-width="5" stroke-linecap="round">
      <path class="wave" d="M175 205 Q200 222 225 205"/>
      <path class="wave w2" d="M162 232 Q200 258 238 232"/>
      <path class="wave w3" d="M150 260 Q200 292 250 260"/>
    </g>

    <!-- satellite -->
    <g class="sat">
      <g transform="translate(200 150) rotate(-12)">
        <rect x="-118" y="-20" width="78" height="40" rx="4" fill="url(#ss-panel)" stroke="#e9eefb" stroke-width="3"/>
        <path d="M-92 -20 v40 M-66 -20 v40 M-118 0 h78" stroke="#e9eefb" stroke-opacity=".6" stroke-width="2"/>
        <rect x="40" y="-20" width="78" height="40" rx="4" fill="url(#ss-panel)" stroke="#e9eefb" stroke-width="3"/>
        <path d="M66 -20 v40 M92 -20 v40 M40 0 h78" stroke="#e9eefb" stroke-opacity=".6" stroke-width="2"/>
        <rect x="-40" y="-4" width="80" height="8" fill="#a7b3cf"/>
        <rect x="-28" y="-34" width="56" height="62" rx="10" fill="#e9eefb"/>
        <rect x="-28" y="-34" width="56" height="16" rx="8" fill="#f5b731"/>
        <circle cy="4" r="10" fill="#1b2d63" stroke="#ffc94d" stroke-width="3"/>
        <path d="M-16 28 L0 50 L16 28 Z" fill="#c6cfe1"/>
        <circle cy="52" r="5" fill="#ffc94d"/>
        <path d="M0 -34 V-54" stroke="#e9eefb" stroke-width="3"/><circle cy="-57" r="5" fill="#fb7185"/>
      </g>
    </g>

    <!-- floating envelope -->
    <g class="env">
      <g transform="translate(300 250) rotate(10)">
        <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#ffffff"/>
        <path d="M-30 -16 L0 6 L30 -16" fill="none" stroke="#2a3f80" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="26" cy="-18" r="9" fill="#34d399"/>
        <path d="M22 -18 l3 3 6 -6" stroke="#0b1530" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <!-- chat bubble -->
    <g transform="translate(92 250) rotate(-8)">
      <path d="M-30 -22 h60 a10 10 0 0 1 10 10 v24 a10 10 0 0 1 -10 10 h-36 l-14 12 v-12 h-10 a10 10 0 0 1 -10 -10 v-24 a10 10 0 0 1 10 -10z" fill="#34d399"/>
      <circle cx="-14" cy="0" r="4" fill="#0b1530"/><circle cx="0" cy="0" r="4" fill="#0b1530"/><circle cx="14" cy="0" r="4" fill="#0b1530"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f5b731" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="200" cy="200" r="197" fill="none" stroke="#f5b731" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 10"/>
</svg>
